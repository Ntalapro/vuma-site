name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build store
        env:
          # PORT is only read by the dev/preview server but vite.config.ts
          # requires it to be set; any value works for a static build.
          PORT: "5000"
          # GitHub Project Pages serve from /<repo-name>/.
          BASE_PATH: "/vuma-site/"
          # Set this repository variable to your Replit app ORIGIN, e.g.
          # https://your-app.replit.app  (a trailing /api is tolerated too).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm --filter @workspace/webafrica-store run build

      - name: SPA fallback + disable Jekyll
        run: |
          cp artifacts/webafrica-store/dist/public/index.html artifacts/webafrica-store/dist/public/404.html
          touch artifacts/webafrica-store/dist/public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/webafrica-store/dist/public

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

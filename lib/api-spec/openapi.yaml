openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: locations
    description: Shared location operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /locations:
    post:
      operationId: createLocation
      tags: [locations]
      summary: Store a shared location
      description: Stores coordinates shared by a user who consented via the browser permission prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedLocationInput"
      responses:
        "201":
          description: Location stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedLocation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SharedLocation:
      type: object
      required:
        - id
        - latitude
        - longitude
        - createdAt
      properties:
        id:
          type: integer
        label:
          type: ["string", "null"]
        latitude:
          type: number
        longitude:
          type: number
        accuracy:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
    SharedLocationInput:
      type: object
      required:
        - latitude
        - longitude
      properties:
        label:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        accuracy:
          type: number
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

